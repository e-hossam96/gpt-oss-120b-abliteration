name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Main dependencies only: the `pod` extra (vLLM) is never installed in CI.
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest -q
      - run: uv run python scripts/check_configs.py
      - run: uv run python scripts/heretic_crosscheck.py --dry-run

[project]
name = "gpt-oss-120b-abliteration"
version = "0.1.0"
description = "Limited-trial two-stage abliteration of openai/gpt-oss-120b using the abliterix CLI"
readme = "README.md"
authors = [
    { name = "e-hossam96", email = "ehh.hossam@gmail.com" }
]
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "abliterix==1.12.2",
]

[project.optional-dependencies]
# GPU machine only (Linux).
pod = [
    "abliterix[vllm]==1.12.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# Unmodified upstream copies.
extend-exclude = ["scripts/upstream"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
